name: Symptom Assistant CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff fastapi httpx streamlit

      - name: Verify Python syntax and compilation
        run: |
          python -m py_compile api.py streamlit_app.py
          if [ -f run_diagnosis.py ]; then python -m py_compile run_diagnosis.py; fi

      - name: Run Ruff static analysis
        run: |
          ruff check . --select=E9,F63,F7,F82 --show-source
