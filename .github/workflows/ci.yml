name: Symptom Assistant CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Clinical API & Triage Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax and compilation
        run: |
          python -m py_compile api.py streamlit_app.py

      - name: Run Clinical Safety & Escalation Contract Tests
        run: |
          python -c "
          import api
          res = api.evaluate_escalation_rules(['chest pain', 'shortness of breath'], 'IN')
          assert res.triggered is True, 'Cardiac red flag failed'
          assert res.clinical_urgency == 'EMERGENCY', 'Urgency level failed'
          print('All deterministic escalation rules validated!')
          "
